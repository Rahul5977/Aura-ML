services:
  backend:
    build: ./aura-backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://aura:aura_pass@db:5432/aura_db
    volumes:
      - ./aura-backend:/app
    command:
      [
        "sh",
        "-c",
        "sleep 10 && python -m prisma db push --force-reset && uvicorn main:app --host 0.0.0.0 --port 8000 --reload",
      ]

  frontend:
    image: node:18
    working_dir: /app
    volumes:
      - ./aura-frontend:/app
    command: ["sh", "-c", "echo 'Frontend placeholder' && tail -f /dev/null"]
    ports:
      - "3000:3000"

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura_pass
      POSTGRES_DB: aura_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
