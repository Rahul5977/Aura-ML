services:
  backend:
    build: ./aura-backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - neo4j
    environment:
      - DATABASE_URL=postgresql://aura:aura_pass@db:5432/aura_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=aura_neo4j_pass
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./aura-backend:/app
    command:
      [
        "sh",
        "-c",
        "sleep 10 && python -m prisma db push --force-reset && uvicorn main:app --host 0.0.0.0 --port 8000 --reload",
      ]

  frontend:
    image: node:18
    working_dir: /app
    volumes:
      - ./aura-frontend:/app
    command: ["sh", "-c", "echo 'Frontend placeholder' && tail -f /dev/null"]
    ports:
      - "3000:3000"

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura_pass
      POSTGRES_DB: aura_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Week 7: Neo4j Graph Database
  neo4j:
    image: neo4j:5.13
    ports:
      - "7474:7474" # HTTP - Neo4j Browser
      - "7687:7687" # Bolt - Database connection
    environment:
      - NEO4J_AUTH=neo4j/aura_neo4j_pass
      - NEO4J_PLUGINS=["graph-data-science", "apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
